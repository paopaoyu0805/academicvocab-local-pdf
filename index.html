<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#183153"><meta name="description" content="AcademicVocab 手机离线生词本"><link rel="manifest" href="./manifest.webmanifest"><title>AcademicVocab 生词本</title>  <script type="module" crossorigin src="./assets/index-BQuVUA4u.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BlM4ZYaH.css">
</head>
<body><main class="app-shell"><header class="hero"><p class="eyebrow">离线生词本</p><h1>我的 AcademicVocab</h1><p>从电脑导入词库后，可在手机离线查看单词、例句与论文来源。不会上传 PDF 或词库。</p></header>
<section class="privacy-note">导入只会保存一份手机本地副本；电脑 E 盘原词库不会被修改。请定期导出手机备份。</section>
<section class="wordbook-panel"><div class="wordbook-actions"><label class="file-button" for="wordbook-import">导入电脑词库</label><input id="wordbook-import" type="file" accept="application/json,.json"><button id="wordbook-export" type="button">导出手机备份</button></div><p id="wordbook-status" role="status">尚未导入词库。</p><input id="wordbook-search" type="search" placeholder="搜索单词、例句或来源" aria-label="搜索单词、例句或来源"><div class="wordbook-layout"><div id="wordbook-list" aria-label="生词列表"></div><section id="wordbook-detail" aria-live="polite"></section></div></section>
<details class="pdf-tools"><summary>本地 PDF 选词（技术验证）</summary><section class="file-panel"><label class="file-button" for="pdf-file">选择本地测试 PDF</label><input id="pdf-file" type="file" accept="application/pdf,.pdf"><p id="file-status" role="status">尚未选择文件。</p></section><section id="viewer-panel" class="viewer-panel" hidden><div class="toolbar"><button id="previous-page" type="button" disabled>上一页</button><span id="page-status">第 0 页</span><button id="next-page" type="button" disabled>下一页</button></div><div id="pdf-page" class="pdf-page"><canvas id="pdf-canvas"></canvas><div id="text-layer" class="textLayer"></div></div></section><section id="selection-panel" class="selection-panel" hidden aria-live="polite"><h2>本地候选</h2><dl><div><dt>选中的文本</dt><dd id="selected-text"></dd></div><div><dt>候选英文例句</dt><dd id="candidate-text"></dd></div><div><dt>来源</dt><dd id="candidate-source"></dd></div><div><dt>本地判断</dt><dd id="candidate-assessment"></dd></div></dl><button id="dismiss-selection" type="button">取消（不保存）</button></section></details></main></body></html>
