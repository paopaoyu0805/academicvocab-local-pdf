</head><body><main class="app-shell"><header class="hero"><p class="eyebrow">阶段 5 · 离线技术验证</p><h1>本地 PDF 选词</h1><p>PDF 仅在当前浏览器内存中读取；不上传、不保存、不翻译。</p></header><section class="privacy-note">请选择非重要测试 PDF。刷新、关闭或取消后，当前 PDF 和选词结果都会清空。</section><section class="file-panel"><label class="file-button" for="pdf-file">选择本地测试 PDF</label><input id="pdf-file" type="file" accept="application/pdf,.pdf"><p id="file-status" role="status">尚未选择文件。</p></section><section id="viewer-panel" class="viewer-panel" hidden><div class="toolbar"><button id="previous-page" type="button" disabled>上一页</button><span id="page-status">第 0 页</span><button id="next-page" type="button" disabled>下一页</button></div><div id="pdf-page" class="pdf-page"><canvas id="pdf-canvas"></canvas><div id="text-layer" class="textLayer"></div></div></section><section id="selection-panel" class="selection-panel" hidden aria-live="polite"><h2>本地候选</h2><dl><div><dt>选中的文本</dt><dd id="selected-text"></dd></div><div><dt>候选英文例句</dt><dd id="candidate-text"></dd></div><div><dt>来源</dt><dd id="candidate-source"></dd></div><div><dt>本地判断</dt><dd id="candidate-assessment"></dd></div></dl><button id="dismiss-selection" type="button">取消（不保存）</button></section></main></body></html>
